[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-draft-mdp"
version = "0.1.0"
description = "Synthetic fantasy-football draft MDP and Monte Carlo state evaluator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14"]
dev = ["matplotlib>=3.7", "pytest>=7.4", "ruff>=0.5"]
ml = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
